<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormFlow Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="login-wrap"><section class="login"><div class="brand">FormFlow <em>Admin</em></div><h1>Build with intent.</h1><p>Sign in to shape your form, save a private draft, and publish the version respondents should see.</p><div id="login-error" class="notice" hidden></div><form id="login-form"><label class="eyebrow" for="username">Username</label><input class="field" id="username" autocomplete="username" required><label class="eyebrow" for="password">Password</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn btn-red" type="submit">Enter builder</button></form><p class="muted" style="font-size:12px;margin-top:22px">Credentials are configured on the server.</p></section></main><script>const loginForm=document.getElementById('login-form');const usernameInput=document.getElementById('username');const passwordInput=document.getElementById('password');const loginError=document.getElementById('login-error');function showLoginError(message){loginError.textContent=message;loginError.hidden=false}fetch('/api/auth/session').then(response=>{if(!response.ok)throw new Error('Session check failed');return response.json()}).then(session=>{if(session.authenticated)location.href='/admin.html'}).catch(()=>showLoginError('Unable to connect to the server. Please try again.'));loginForm.addEventListener('submit',async event=>{event.preventDefault();loginError.hidden=true;const submitButton=loginForm.querySelector('button[type="submit"]');submitButton.disabled=true;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:usernameInput.value,password:passwordInput.value})});const data=await response.json();if(!response.ok){showLoginError(data.error||'Login failed.');return}location.href='/admin.html'}catch(error){showLoginError('Unable to connect to the server. Please try again.')}finally{submitButton.disabled=false}})</script></body></html>
