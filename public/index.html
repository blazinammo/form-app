<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormFlow Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="login-wrap"><section class="login"><div class="brand">FormFlow <em>Admin</em></div><h1>Build with intent.</h1><p>Sign in to shape your form, save a private draft, and publish the version respondents should see.</p><div id="login-error" class="notice" hidden></div><form id="login-form"><label class="eyebrow" for="username">Username</label><input class="field" id="username" autocomplete="username" required><label class="eyebrow" for="password">Password</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn btn-red" type="submit">Enter builder</button></form><p class="muted" style="font-size:12px;margin-top:22px">Credentials are configured on the server.</p></section></main><script>fetch('/api/auth/session').then(r=>r.json()).then(s=>{if(s.authenticated)location.href='/admin.html'});document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('login-error');const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='/admin.html';else{const d=await r.json();error.textContent=d.error;error.hidden=false}})</script></body></html>
