<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormFlow Builder</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/">FormFlow <em>Builder</em></a><nav class="top-actions" aria-label="Main navigation"><a class="btn btn-light" href="/">Home</a><a class="btn btn-light" href="/form.html" target="_blank">Published form</a><button class="btn btn-light" id="logout">Log out</button><button class="btn btn-green" id="publish">Publish</button></nav></header><div class="layout"><aside class="sidebar"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Pages</span><button class="btn btn-red" id="add-page">+ Page</button></div><div id="pages"></div></aside><main class="content"><div class="content-inner" id="editor"></div></main><aside class="sidebar right"><div class="tabs"><button class="tab active" data-tab="logic">Logic</button><button class="tab" data-tab="variables">Variables</button></div><div id="panel"></div></aside></div><div class="toast" id="toast"></div><script>window.addEventListener('error',event=>{const editor=document.getElementById('editor');if(editor&&!editor.innerHTML.trim())editor.innerHTML='<div class="empty"><h1>Builder could not load</h1><p class="muted">'+String(event.error?.message||event.message||'The server returned an unexpected response.')+'</p><button class="btn btn-dark" onclick="location.reload()">Retry</button></div>'});window.addEventListener('unhandledrejection',event=>{const editor=document.getElementById('editor');if(editor&&!editor.innerHTML.trim())editor.innerHTML='<div class="empty"><h1>Builder could not load</h1><p class="muted">'+String(event.reason?.message||event.reason||'The server returned an unexpected response.')+'</p><button class="btn btn-dark" onclick="location.reload()">Retry</button></div>'})</script><script src="/admin-guard.js"></script><script src="/admin.js"></script></body></html>
