<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191a18"><title>FormFlow Builder</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/builder-enhancements.css"><link rel="stylesheet" href="/visual-system.css"></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="FormFlow home"><span class="brand-mark" aria-hidden="true">f</span> FormFlow <em>Builder</em></a><nav class="top-actions" aria-label="Main navigation"><span id="save-state" class="save-state" aria-live="polite">Saved</span><a class="btn btn-light" href="/">Home</a><a class="btn btn-light" href="/form.html" target="_blank">Open form</a><button class="btn btn-light" id="preview-draft">Preview draft</button><button class="btn btn-light" id="logout">Log out</button><button class="btn btn-white" id="publish">Publish</button></nav></header>
<div class="builder-mobile-nav"><label class="sr-only" for="mobile-page">Current page</label><select class="select" id="mobile-page"></select><button class="btn btn-red" id="mobile-add-page">+ Page</button><button class="btn btn-dark" id="toggle-tools" aria-expanded="false" aria-controls="builder-tools">Tools</button></div>
<div class="layout"><aside class="sidebar"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Pages</span><button class="btn btn-red" id="add-page">+ Page</button></div><div id="pages"></div></aside><main class="content"><section class="publish-readiness" id="publish-readiness" aria-live="polite" aria-atomic="true"><p class="eyebrow">Publish readiness</p><p class="muted">Checking your draft…</p></section><div class="content-inner" id="editor"></div></main><aside class="sidebar right" id="builder-tools"><div class="tools-heading"><span class="eyebrow">Builder tools</span><button class="icon-btn" id="close-tools" aria-label="Close builder tools">×</button></div><div class="tabs"><button class="tab active" data-tab="logic">Logic</button><button class="tab" data-tab="variables">Variables</button><button class="tab" data-tab="document">Document</button></div><div id="panel"></div></aside></div>
<div class="document-drawer" id="document-drawer" aria-hidden="true"><div class="document-drawer-backdrop" onclick="closeDocumentEditor()"></div><section class="document-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="document-drawer-title"><header class="document-drawer-header"><div><p class="eyebrow">FormFlow document studio</p><h2 id="document-drawer-title">Write your document</h2></div><button class="icon-btn document-close" onclick="closeDocumentEditor()" aria-label="Close document editor">×</button></header><div id="document-drawer-content"></div></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>window.addEventListener('error',event=>{const editor=document.getElementById('editor');if(editor&&!editor.innerHTML.trim())editor.innerHTML='<div class="empty"><h1>Builder could not load</h1><p class="muted">'+String(event.error?.message||event.message||'The server returned an unexpected response.')+'</p><button class="btn btn-dark" onclick="location.reload()">Retry</button></div>'});window.addEventListener('unhandledrejection',event=>{const editor=document.getElementById('editor');if(editor&&!editor.innerHTML.trim())editor.innerHTML='<div class="empty"><h1>Builder could not load</h1><p class="muted">'+String(event.reason?.message||event.reason||'The server returned an unexpected response.')+'</p><button class="btn btn-dark" onclick="location.reload()">Retry</button></div>'})</script><script src="/admin-guard.js"></script><script src="/admin.js"></script></body>
</html>
